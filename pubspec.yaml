name: deener_alo
description: "Deener Alo (দ্বীনের আলো) - Modern Islamic Daily Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local Storage & Utilities
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  timezone: ^0.10.0

  # System Integration, Alarms & Notifications
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0

  # Islamic Engines
  adhan: ^2.0.0+1
  hijri: ^3.0.0

  # Geolocation & Sensors
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0

  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  lucide_icons_flutter: ^4.0.1
  flutter_svg: ^2.3.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/icons/
